name: release

on:
  push:
    tags:
      - 'v*'
  # Lets you re-run a release build manually if a workflow run failed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The `sync-secret-service` keyring backend pulls in dbus headers on Linux.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build & upload archive
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: bgg
          target: ${{ matrix.target }}
          # tar.gz on unix, .zip on windows — defaults from the action.
          archive: $bin-$tag-$target
          token: ${{ secrets.GITHUB_TOKEN }}
